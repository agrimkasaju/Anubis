<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06090F" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="42" fill="url(#bgGlow)" />

  <!-- Constellation Ties -->
  <g stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#glow)">
    <!-- Hourglass Body -->
    <line x1="26" y1="22" x2="74" y2="22" />
    <line x1="74" y1="22" x2="58" y2="50" />
    <line x1="58" y1="50" x2="70" y2="78" />
    <line x1="70" y1="78" x2="30" y2="78" />
    <line x1="30" y1="78" x2="42" y2="50" />
    <line x1="42" y1="50" x2="26" y2="22" />
    <!-- Diagonal Nexus Struts -->
    <line x1="26" y1="22" x2="50" y2="50" stroke-opacity="0.5" stroke-dasharray="2 2" />
    <line x1="74" y1="22" x2="50" y2="50" stroke-opacity="0.5" stroke-dasharray="2 2" />
    <line x1="30" y1="78" x2="50" y2="50" stroke-opacity="0.5" stroke-dasharray="2 2" />
    <line x1="70" y1="78" x2="50" y2="50" stroke-opacity="0.5" stroke-dasharray="2 2" />
    <!-- Orion's Belt -->
    <line x1="42" y1="50" x2="58" y2="50" stroke="#34D399" stroke-width="2" />
  </g>

  <!-- Central Nexus Rings -->
  <circle cx="50" cy="50" r="14" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.7" fill="none" />
  <circle cx="50" cy="50" r="9" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.9" fill="none" />

  <!-- Outer Stars -->
  <circle cx="26" cy="22" r="3.8" fill="#F59E0B" filter="url(#glow)" /> <!-- Betelgeuse -->
  <circle cx="74" cy="22" r="3.2" fill="#22D3EE" filter="url(#glow)" /> <!-- Bellatrix -->
  <circle cx="30" cy="78" r="3.0" fill="#22D3EE" filter="url(#glow)" /> <!-- Saiph -->
  <circle cx="70" cy="78" r="4.0" fill="#38BDF8" filter="url(#glow)" /> <!-- Rigel -->

  <!-- Orion's Belt Stars (Pillars) -->
  <circle cx="42" cy="50" r="2.8" fill="#10B981" filter="url(#glow)" /> <!-- Fundamentals -->
  <circle cx="50" cy="50" r="3.8" fill="#FFFFFF" filter="url(#glow)" /> <!-- Composite Core -->
  <circle cx="58" cy="50" r="2.8" fill="#06B6D4" filter="url(#glow)" /> <!-- Microstructure -->
</svg>
